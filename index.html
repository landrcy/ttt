<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talk to Tung (ttt)</title>
<meta name="description" content="Ask Tung Tung Tung Sahur anything. He answers. Loudly. With a drum.">
<meta name="music-credit" content="Forest Ambience — OpenGameArt.org, CC0">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="scene" aria-label="Tung Tung Tung Sahur reclining in a night woodland"></canvas>
<div id="bubble" aria-live="polite" hidden><span id="btext"></span></div>
<form id="ask" autocomplete="off">
  <input id="q" maxlength="140" placeholder="ask tung something…" aria-label="Ask Tung a question">
  <button id="send" type="submit" aria-label="Send" title="send"><i></i></button>
  <button id="mute" type="button" aria-label="Toggle ambient sound" title="forest ambience (CC0)"><i></i></button>
</form>
<script src="tung.js"></script><script src="world.js"></script><script src="speech.js"></script><script src="sfx.js"></script><script src="app.js"></script>
</body></html>
